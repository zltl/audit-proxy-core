name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: "$(go env GOPATH)/bin/staticcheck" ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Local smoke test
        run: ./scripts/smoke-test.sh

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dataplane image
        run: docker build -f deploy/docker/Dockerfile.dataplane -t audit-proxy-dataplane:ci .

      - name: Build control-plane image
        run: docker build -f deploy/docker/Dockerfile.control-plane -t audit-proxy-control-plane:ci .

  legacy-c:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        build_type: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssh-dev cppcheck

      - name: Build legacy C data plane (${{ matrix.build_type }})
        run: make -C legacy/c-dataplane ${{ matrix.build_type }}

      - name: Run legacy C tests
        run: make -C legacy/c-dataplane test

      - name: Static analysis
        if: matrix.build_type == 'debug'
        run: make -C legacy/c-dataplane check || true
