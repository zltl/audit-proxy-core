syntax = "proto3";

package auditproxy.v1;

option go_package = "github.com/zltl/audit-proxy-core/api/proto/auditproxy/v1;auditproxyv1";

import "google/protobuf/timestamp.proto";

// AccessDecisionService is the policy decision point the SSH data plane calls.
//
// The data plane terminates connections and moves bytes; it does not hold the
// policy or the credentials. Every question that could grant or widen access —
// who is this, may they reach that host, as which account, with which
// capabilities, and may they run this command — is answered here, against the
// database, at the moment it is asked. That is what makes a revocation take
// effect on the next decision instead of the next configuration reload.
service AccessDecisionService {
  // Authenticate runs one step of the SSH authentication exchange. Multi-round
  // methods such as keyboard-interactive call it repeatedly, carrying the
  // state handle the previous response returned.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // AuthorizeSession decides whether an authenticated principal may open a
  // session to a target, and returns the constraints it must run under.
  rpc AuthorizeSession(AuthorizeSessionRequest) returns (AuthorizeSessionResponse);

  // AuthorizeChannel gates each channel a client opens, so that a session
  // permitted to run a shell cannot also open a tunnel unless policy says so.
  rpc AuthorizeChannel(AuthorizeChannelRequest) returns (AuthorizeChannelResponse);

  // AuthorizeCommand screens a command before it reaches the upstream host.
  //
  // It streams because a command may require a second person's approval: the
  // first response reports that the session is waiting, and a later one carries
  // the outcome. A single unary call would either have to block a connection
  // for minutes or give up the ability to hold one.
  rpc AuthorizeCommand(AuthorizeCommandRequest) returns (stream AuthorizeCommandResponse);

  // ResolveHostKey checks a host key presented by an upstream against the trust
  // store, and records first-contact keys for an operator to rule on.
  rpc ResolveHostKey(ResolveHostKeyRequest) returns (ResolveHostKeyResponse);

  // IssueUpstreamCredential hands back the material needed to authenticate to
  // the upstream host for one session. Short-lived certificates are preferred;
  // stored secrets are decrypted here and never persisted by the data plane.
  rpc IssueUpstreamCredential(IssueUpstreamCredentialRequest) returns (IssueUpstreamCredentialResponse);

  // Session lifecycle. Sessions live in the shared database so that any node
  // can enumerate and terminate a session another node is serving.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc HeartbeatSession(HeartbeatSessionRequest) returns (HeartbeatSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // StreamRevocations pushes termination requests to the node that owns the
  // affected sessions. Heartbeats also carry the flag, so a node still learns
  // about a revocation if this stream is interrupted.
  rpc StreamRevocations(StreamRevocationsRequest) returns (stream Revocation);

  // ReportEvents ships audit records. The data plane spools locally and
  // replays, so a control-plane outage delays delivery rather than losing it.
  rpc ReportEvents(stream AuditEventBatch) returns (ReportEventsResponse);

  // GetPolicySnapshot returns the rules a node needs to keep serving while the
  // control plane is unreachable, for deployments that choose availability over
  // strict centralisation.
  rpc GetPolicySnapshot(PolicySnapshotRequest) returns (PolicySnapshot);
}

// --------------------------------------------------------------------------
// Authentication
// --------------------------------------------------------------------------

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_NONE = 1;
  AUTH_METHOD_PASSWORD = 2;
  AUTH_METHOD_PUBLIC_KEY = 3;
  AUTH_METHOD_CERTIFICATE = 4;
  AUTH_METHOD_KEYBOARD_INTERACTIVE = 5;
}

enum AuthResult {
  AUTH_RESULT_UNSPECIFIED = 0;
  // SUCCESS: authentication is complete.
  AUTH_RESULT_SUCCESS = 1;
  // FAILURE: the attempt was rejected.
  AUTH_RESULT_FAILURE = 2;
  // PARTIAL: the factor was accepted but more are required; the response names
  // which methods may be tried next.
  AUTH_RESULT_PARTIAL = 3;
}

// ClientInfo describes where an attempt came from. It is carried on every
// decision so that policy can consider the origin and the audit trail records
// it without the data plane having to repeat itself.
message ClientInfo {
  string source_ip = 1;
  int32 source_port = 2;
  string client_version = 3;
  string node_id = 4;
  // connection_id correlates every decision made for one TCP connection.
  string connection_id = 5;
}

message AuthenticateRequest {
  ClientInfo client = 1;
  // username as presented by the SSH client.
  string username = 2;
  AuthMethod method = 3;

  // password is set for password authentication.
  string password = 4;
  // public_key is the wire-format key blob, base64 encoded, for publickey and
  // certificate authentication.
  string public_key = 5;
  // public_key_fingerprint is the SHA256 fingerprint of public_key.
  string public_key_fingerprint = 6;
  // signature_verified reports that the data plane already checked the client's
  // possession of the private key. The decision point refuses a publickey
  // attempt without it, so an unverified key can never be accepted.
  bool signature_verified = 7;

  // state_token carries multi-round state issued by a previous response.
  string state_token = 8;
  // responses holds the answers to the prompts of the previous round.
  repeated string responses = 9;
}

message AuthPrompt {
  string prompt = 1;
  bool echo = 2;
}

message AuthenticateResponse {
  AuthResult result = 1;
  // reason is safe to log; it explains a rejection without revealing whether
  // the account exists.
  string reason = 2;
  string username = 3;
  repeated string roles = 4;

  // remaining_methods lists what may be attempted next when result is PARTIAL.
  repeated AuthMethod remaining_methods = 5;
  // instruction and prompts drive a keyboard-interactive round.
  string instruction = 6;
  repeated AuthPrompt prompts = 7;
  string state_token = 8;

  // password_change_required asks the client to rotate before proceeding.
  bool password_change_required = 9;
}

// --------------------------------------------------------------------------
// Session authorization
// --------------------------------------------------------------------------

enum RecordPolicy {
  RECORD_POLICY_UNSPECIFIED = 0;
  // FULL captures the terminal stream along with commands and transfers.
  RECORD_POLICY_FULL = 1;
  // COMMANDS captures command and transfer metadata but not the stream, for
  // environments where screen content itself is sensitive.
  RECORD_POLICY_COMMANDS = 2;
  RECORD_POLICY_NONE = 3;
}

message AuthorizeSessionRequest {
  ClientInfo client = 1;
  string username = 2;
  repeated string roles = 3;
  // target names a registered target, or a host[:port] the client asked for.
  string target = 4;
  string target_host = 5;
  int32 target_port = 6;
  // upstream_login is the account the client wants to assume on the target.
  string upstream_login = 7;
}

message AuthorizeSessionResponse {
  bool allowed = 1;
  string reason = 2;
  // rule_id and rule_name identify the rule that decided, for the audit trail.
  string rule_id = 3;
  string rule_name = 4;

  // target_id and the resolved address the data plane should dial.
  string target_id = 5;
  string target_host = 6;
  int32 target_port = 7;
  string upstream_login = 8;

  // features lists the SSH capabilities this session may use, by name.
  repeated string features = 9;

  int64 max_session_seconds = 10;
  int64 idle_timeout_seconds = 11;
  RecordPolicy record_policy = 12;
  string command_policy_id = 13;

  // approval_required means the session must not be connected until a second
  // person approves; approval_id identifies the pending request.
  bool approval_required = 14;
  string approval_id = 15;
}

// --------------------------------------------------------------------------
// Channel authorization
// --------------------------------------------------------------------------

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_SESSION = 1;
  CHANNEL_TYPE_DIRECT_TCPIP = 2;
  CHANNEL_TYPE_FORWARDED_TCPIP = 3;
  CHANNEL_TYPE_X11 = 4;
  CHANNEL_TYPE_AGENT = 5;
}

enum ChannelRequestType {
  CHANNEL_REQUEST_UNSPECIFIED = 0;
  CHANNEL_REQUEST_PTY = 1;
  CHANNEL_REQUEST_SHELL = 2;
  CHANNEL_REQUEST_EXEC = 3;
  CHANNEL_REQUEST_SUBSYSTEM = 4;
  CHANNEL_REQUEST_ENV = 5;
  CHANNEL_REQUEST_X11 = 6;
  CHANNEL_REQUEST_AGENT = 7;
  CHANNEL_REQUEST_WINDOW_CHANGE = 8;
  CHANNEL_REQUEST_TCPIP_FORWARD = 9;
}

message AuthorizeChannelRequest {
  string session_id = 1;
  ChannelType channel_type = 2;
  ChannelRequestType request_type = 3;
  // subsystem or command payload, depending on request_type.
  string payload = 4;
  // dest_host and dest_port describe a forwarding request.
  string dest_host = 5;
  int32 dest_port = 6;
}

message AuthorizeChannelResponse {
  bool allowed = 1;
  string reason = 2;
  // required_feature names the capability the session is missing, which turns
  // a refusal into something an operator can act on.
  string required_feature = 3;
}

// --------------------------------------------------------------------------
// Command control
// --------------------------------------------------------------------------

enum CommandDecision {
  COMMAND_DECISION_UNSPECIFIED = 0;
  COMMAND_DECISION_ALLOW = 1;
  COMMAND_DECISION_DENY = 2;
  // AUDIT allows the command but flags it.
  COMMAND_DECISION_AUDIT = 3;
  // REWRITE substitutes a safer command.
  COMMAND_DECISION_REWRITE = 4;
  // PENDING_APPROVAL means the session is held; a later stream message carries
  // the outcome.
  COMMAND_DECISION_PENDING_APPROVAL = 5;
}

message AuthorizeCommandRequest {
  string session_id = 1;
  string username = 2;
  repeated string roles = 3;
  string target = 4;
  string command = 5;
  string command_policy_id = 6;
}

message AuthorizeCommandResponse {
  CommandDecision decision = 1;
  string reason = 2;
  string rule_id = 3;
  string severity = 4;
  // rewritten_command is set when decision is REWRITE.
  string rewritten_command = 5;
  // approval_id identifies the pending request when decision is
  // PENDING_APPROVAL, so an operator can be pointed at it.
  string approval_id = 6;
}

// --------------------------------------------------------------------------
// Host key trust
// --------------------------------------------------------------------------

enum HostKeyVerdict {
  HOST_KEY_VERDICT_UNSPECIFIED = 0;
  // TRUSTED: the key is pinned, or a trusted host CA signed the certificate.
  HOST_KEY_VERDICT_TRUSTED = 1;
  // REJECTED: the key is unknown or revoked and the connection must not
  // proceed. Continuing would mean recording a session with something that is
  // not provably the intended host.
  HOST_KEY_VERDICT_REJECTED = 2;
  // PENDING: recorded on first contact and awaiting an operator decision.
  // Whether the connection proceeds depends on the deployment's setting.
  HOST_KEY_VERDICT_PENDING = 3;
}

message ResolveHostKeyRequest {
  string target_id = 1;
  string target_host = 2;
  int32 target_port = 3;
  string algorithm = 4;
  // public_key is the base64 wire-format key.
  string public_key = 5;
  string fingerprint = 6;
  // is_certificate reports that the upstream presented a host certificate.
  bool is_certificate = 7;
  // ca_fingerprint is the signing authority when is_certificate is set.
  string ca_fingerprint = 8;
}

message ResolveHostKeyResponse {
  HostKeyVerdict verdict = 1;
  string reason = 2;
  // proceed tells the data plane whether to continue for a PENDING verdict.
  bool proceed = 3;
}

// --------------------------------------------------------------------------
// Upstream credentials
// --------------------------------------------------------------------------

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_PASSWORD = 1;
  CREDENTIAL_KIND_PRIVATE_KEY = 2;
  // CERTIFICATE is a short-lived certificate minted for this session.
  CREDENTIAL_KIND_CERTIFICATE = 3;
  // AGENT forwards the user's own agent to the upstream.
  CREDENTIAL_KIND_AGENT = 4;
}

message IssueUpstreamCredentialRequest {
  string session_id = 1;
  string target_id = 2;
  string upstream_login = 3;
  string username = 4;
  // public_key is the ephemeral key the data plane generated for this session,
  // to be signed when a certificate is issued. Keeping the private half in the
  // data plane means the signing service never holds a usable credential.
  string public_key = 5;
}

message IssueUpstreamCredentialResponse {
  CredentialKind kind = 1;
  // password and private_key carry vaulted material, decrypted for this call
  // only. Callers must not persist them.
  string password = 2;
  string private_key = 3;
  // certificate is the signed short-lived certificate in authorized_keys form.
  string certificate = 4;
  google.protobuf.Timestamp expires_at = 5;
  string reason = 6;
}

// --------------------------------------------------------------------------
// Session lifecycle
// --------------------------------------------------------------------------

message OpenSessionRequest {
  ClientInfo client = 1;
  string username = 2;
  string target_id = 3;
  string target_host = 4;
  int32 target_port = 5;
  string upstream_login = 6;
  string rule_id = 7;
}

message OpenSessionResponse {
  string session_id = 1;
  // allowed is false when a limit that can only be checked against live state,
  // such as concurrency, refuses the session after policy allowed it.
  bool allowed = 2;
  string reason = 3;
}

message HeartbeatSessionRequest {
  string session_id = 1;
  int64 bytes_in = 2;
  int64 bytes_out = 3;
}

message HeartbeatSessionResponse {
  // revoked tells the owning node to disconnect.
  bool revoked = 1;
  string reason = 2;
}

message CloseSessionRequest {
  string session_id = 1;
  int64 bytes_in = 2;
  int64 bytes_out = 3;
  string status = 4;
  string termination_info = 5;
  string recording_ref = 6;
}

message CloseSessionResponse {}

message StreamRevocationsRequest {
  string node_id = 1;
}

message Revocation {
  string session_id = 1;
  string reason = 2;
  google.protobuf.Timestamp requested_at = 3;
}

// --------------------------------------------------------------------------
// Audit reporting
// --------------------------------------------------------------------------

message AuditEvent {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string event_type = 3;
  string session_id = 4;
  string username = 5;
  string source_ip = 6;
  string target_host = 7;
  int32 target_port = 8;
  string upstream_login = 9;
  string node_id = 10;

  // channel_type and decision describe what was attempted and what policy said.
  string channel_type = 11;
  string decision = 12;
  string rule_id = 13;

  // command carries a screened command line.
  string command = 14;
  // file_transfer describes a file operation seen inside sftp or scp.
  FileTransferRecord file_transfer = 15;
  // port_forward describes a tunnel that was opened.
  PortForwardRecord port_forward = 16;

  int64 bytes_in = 17;
  int64 bytes_out = 18;
  int32 risk_score = 19;
  string details = 20;

  // integrity_hash and prev_hash chain events together so that removing or
  // altering one is detectable.
  string integrity_hash = 21;
  string prev_hash = 22;
}

message FileTransferRecord {
  // direction is "upload" or "download", from the client's point of view.
  string direction = 1;
  string path = 2;
  string filename = 3;
  int64 size = 4;
  string checksum = 5;
  string protocol = 6;
  // allowed and reason record what the transfer policy decided.
  bool allowed = 7;
  string reason = 8;
}

message PortForwardRecord {
  // kind is "local", "remote", or "dynamic".
  string kind = 1;
  string listen_host = 2;
  int32 listen_port = 3;
  string dest_host = 4;
  int32 dest_port = 5;
  int64 bytes_in = 6;
  int64 bytes_out = 7;
}

message AuditEventBatch {
  repeated AuditEvent events = 1;
  string node_id = 2;
}

message ReportEventsResponse {
  int64 accepted = 1;
}

// --------------------------------------------------------------------------
// Offline policy snapshot
// --------------------------------------------------------------------------

message PolicySnapshotRequest {
  string node_id = 1;
  // known_version lets a node skip a transfer it already has.
  string known_version = 2;
}

message PolicySnapshot {
  string version = 1;
  google.protobuf.Timestamp generated_at = 2;
  // rules is the serialised rule set, in the store's JSON representation.
  bytes rules = 3;
  // unchanged is set when the caller's known_version is still current.
  bool unchanged = 4;
}
