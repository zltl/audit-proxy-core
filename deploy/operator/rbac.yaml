apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-proxy-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: audit-proxy-operator
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["proxy.auditproxy.io"]
    resources: ["auditproxyclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["proxy.auditproxy.io"]
    resources: ["auditproxyclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps", "secrets", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audit-proxy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: audit-proxy-operator
subjects:
  - kind: ServiceAccount
    name: audit-proxy-operator
    namespace: default
